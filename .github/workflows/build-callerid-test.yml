name: "Build Caller-ID Test"

# Dedicated test build for the caller-identification feature branch.
# Builds all platforms UNSIGNED and uploads downloadable artifacts so the
# change can be tested locally. Triggered automatically on push to the
# feature branch (and manually via the Actions tab). Safe to delete once
# the feature is merged.
on:
  push:
    branches:
      - claude/caller-identification-feature-tbeigt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            build-args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: "--target x86_64-pc-windows-msvc"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build-args: "--target x86_64-unknown-linux-gnu --bundles deb"
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build-args: "--target x86_64-unknown-linux-gnu --bundles appimage,rpm"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      # Disable updater-artifact creation for this test build. build.yml always
      # feeds TAURI_SIGNING_PRIVATE_KEY from repo secrets, and this fork's key is
      # not a valid signing key, so signing the updater artifact fails *after* the
      # installers are already built. Skipping updater artifacts avoids that step
      # entirely while still producing the .dmg/.msi/.exe/.deb/.AppImage/.rpm.
      # Absolute path so it resolves regardless of the tauri build working dir.
      build-args: ${{ matrix.build-args }} -c ${{ github.workspace }}/frontend/src-tauri/ci-test-overrides.json
      asset-prefix: meetily-callerid
      upload-artifacts: true
      sign-binaries: false
      ref: ${{ github.ref }}
    secrets: inherit
